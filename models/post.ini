[model]
name = Post
label = {{ this.title }}

[fields.title]
label = Título
type = string

[fields.pub_date]
label = Fecha de publicación
type = date

[fields.read_time]
label = Tiempo de lectura
type = string
description = Ejemplo: "8 min"

[fields.tags]
label = Tags
type = strings

[fields.excerpt]
label = Resumen
type = text

[fields.theme]
label = Color del thumbnail
type = select
choices = green, blue, red, coral

[fields.cover_image]
label = Imagen de portada (URL o ruta)
type = string
description = Si se proporciona, reemplaza el thumbnail de color. Ej: /static/cover-django.jpg

[fields.body]
label = Cuerpo
type = markdown
