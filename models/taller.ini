[model]
name = Taller
label = {{ this.title }}

[fields.title]
label = Título del taller
type = string

[fields.cover_image]
label = Imagen de portada (URL o ruta)
type = string
description = Ej: /static/cover-django-channels.jpg

[fields.descripcion]
label = Descripción breve
type = markdown

[fields.producto_final]
label = Producto final (qué van a construir)
type = markdown

[fields.objetivos]
label = Objetivos de aprendizaje (lista markdown)
type = markdown

[fields.duracion]
label = Duración estimada
type = string

[fields.stack]
label = Prerrequisitos / Stack (lista markdown)
type = markdown

[fields.prerrequisitos_resumen]
label = Resumen de prerrequisitos (una línea)
type = string

[fields.orden]
label = Orden en el índice
type = integer

[children]
model = taller-paso
order_by = orden, _id
