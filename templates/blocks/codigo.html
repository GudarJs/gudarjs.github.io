<div class="my-5 rounded-2xl overflow-hidden bg-slate-900 border border-black/10">
    {% if this.etiqueta or this.lenguaje %}
    <div class="flex items-center justify-between px-4 py-2.5 bg-black/25 font-mono text-xs text-white/70">
        {% if this.etiqueta %}
        <span class="flex items-center gap-2"><i class="fa fa-file-code-o text-white/50"></i> {{ this.etiqueta }}</span>
        {% else %}<span></span>{% endif %}
        {% if this.lenguaje %}<span class="text-[10px] uppercase tracking-[0.1em] text-white/40">{{ this.lenguaje }}</span>{% endif %}
    </div>
    {% endif %}
    <pre class="m-0 p-[18px_20px] font-mono text-[13.5px] leading-[1.7] text-[#f5f5f5] overflow-x-auto bg-transparent"><code class="language-{{ this.lenguaje }}">{{ this.codigo }}</code></pre>
</div>
