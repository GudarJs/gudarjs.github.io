<div class="bg-white p-7 text-center border border-[#e9ecef] rounded-2xl transition-all duration-[0.4s] hover:-translate-y-0.5 hover:shadow-[0_6px_20px_rgba(0,0,0,0.06)] hover:border-azure">
    <div class="size-14 mx-auto mb-4 bg-azure/10 text-azure rounded-full flex items-center justify-center text-2xl">
        <i class="fa {{ this.icon }}"></i>
    </div>
    <h3 class="text-base font-bold text-slate-900 mb-2">{{ this.title }}</h3>
    <p class="text-[13px] text-slate-600 m-0 leading-[1.5]">{{ this.desc }}</p>
</div>
