<div class="bg-white p-7 pb-6 rounded-2xl border border-[#e9ecef] flex flex-col gap-4">
    <div class="font-serif text-5xl leading-[0.4] text-azure h-4">"</div>
    <blockquote class="m-0 text-[14.5px] leading-relaxed text-slate-600 italic">{{ this.quote }}</blockquote>
    <div class="flex items-center gap-3 mt-auto">
        <div class="size-11 rounded-full bg-gradient-to-br from-azure to-deep-blue text-white flex items-center justify-center font-bold text-base shrink-0">{{ this.avatar }}</div>
        <div class="flex flex-col">
            <span class="font-bold text-slate-900 text-sm">{{ this.name }}</span>
            <span class="text-xs text-slate-400">{{ this.role }}</span>
        </div>
    </div>
</div>
